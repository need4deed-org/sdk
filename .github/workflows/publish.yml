name: Publish on Merge to Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

      - name: Bump patch version
        run: |
          PUBLISHED=$(npm view need4deed-sdk version 2>/dev/null || echo "0.0.0")
          LOCAL=$(node -p "require('./package.json').version")
          NEXT=$(node -e '
            const parse = (v) => v.split(".").map(Number);
            const [a, b] = process.argv.slice(1).map(parse);
            const cmp = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            const [major, minor, patch] = cmp >= 0 ? a : b;
            console.log(`${major}.${minor}.${patch + 1}`);
          ' "$PUBLISHED" "$LOCAL")
          echo "npm: $PUBLISHED, package.json: $LOCAL -> $NEXT"
          yarn version --new-version "$NEXT" --no-git-tag-version

      - name: Publish to npm
        run: yarn publish --non-interactive
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
