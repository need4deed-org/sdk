name: Publish on Merge to Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

      - name: Bump patch version
        run: |
          PUBLISHED=$(npm view need4deed-sdk version 2>/dev/null || echo "0.0.0")
          LOCAL=$(node -p "require('./package.json').version")
          NEXT=$(node -e '
            const parse = (v) => v.split(".").map(Number);
            const [a, b] = process.argv.slice(1).map(parse);
            const cmp = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            const [major, minor, patch] = cmp >= 0 ? a : b;
            console.log(`${major}.${minor}.${patch + 1}`);
          ' "$PUBLISHED" "$LOCAL")
          echo "npm: $PUBLISHED, package.json: $LOCAL -> $NEXT"
          yarn version --new-version "$NEXT" --no-git-tag-version

      # npm view lags behind a fresh publish, so the bumped version may already be taken
      - name: Publish to npm
        run: |
          set -o pipefail
          for attempt in 1 2 3 4 5; do
            if yarn publish --non-interactive 2>&1 | tee "$RUNNER_TEMP/publish.log"; then
              exit 0
            fi
            if ! grep -qiE "cannot publish over|E409|409 Conflict" "$RUNNER_TEMP/publish.log"; then
              exit 1
            fi
            echo "version is taken or npm is busy (attempt $attempt), retrying with the next patch"
            sleep 10
            yarn version --patch --no-git-tag-version
          done
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
